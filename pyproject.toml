[project]
name = "jlens"
version = "0.1.0"
description = "Reproduction of the J-lens / global workspace paper on open models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.52",
    "accelerate>=1.0",
    "datasets>=3.0",
    "einops>=0.8",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jlens"]
